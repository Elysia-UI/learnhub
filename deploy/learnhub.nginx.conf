# Replace __PUBLIC_HOST__ with the selected domain or public IP.
# Install as /etc/nginx/conf.d/learnhub.conf only after checking existing vhosts.
server {
    listen 80;
    server_name __PUBLIC_HOST__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/learnhub-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://__PUBLIC_HOST__$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name __PUBLIC_HOST__;
    ssl_certificate /etc/learnhub/tls/fullchain.pem;
    ssl_certificate_key /etc/learnhub/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:learnhub_tls:1m;
    ssl_session_timeout 1d;

    client_max_body_size 12m;
    client_body_timeout 30s;
    keepalive_timeout 30s;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # This deployment has one local proxy, so discard untrusted incoming XFF.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location = /api/chat/events {
        gzip off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        proxy_pass http://127.0.0.1:3002;
    }
    location ^~ /api/ai/ {
        gzip off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_pass http://127.0.0.1:3002;
    }
    location /api/ {
        proxy_cache off;
        proxy_pass http://127.0.0.1:3002;
    }
    location ~ /\. {
        return 404;
    }
    location / {
        proxy_pass http://127.0.0.1:3002;
    }
}
